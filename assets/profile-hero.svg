<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Vince — Software engineering and intelligent systems</title>
  <desc id="desc">A minimal dark navy banner with modern typography and an abstract perception radar motif.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#080F1D"/>
      <stop offset="0.65" stop-color="#101D30"/>
      <stop offset="1" stop-color="#0A1527"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#55E1CB"/>
      <stop offset="1" stop-color="#5C9EFA"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#236A77" stop-opacity="0.31"/>
      <stop offset="1" stop-color="#236A77" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#A7C4DD" stroke-opacity=".065" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="18" fill="url(#background)"/>
