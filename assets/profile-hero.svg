  <text x="64" y="168" fill="#F4F8FC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="55" font-weight="750">Build what matters.</text>
  <text x="66" y="207" fill="#A8BED1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21">Intelligent systems. Reliable software. Clear design.</text>
  <rect x="64" y="247" width="385" height="36" rx="18" fill="#1D3146" fill-opacity=".82" stroke="#668DA6" stroke-opacity=".27"/>
  <text x="84" y="270" fill="#BEEBEB" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" letter-spacing=".6">PERCEPTION</text>
